# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: session-title-llm
  disabled: true

# Git Bash cannot initialize Cygwin's shared state inside the Windows ACL
# sandbox token. ACP keeps a confined shell by selecting the native PowerShell
# executor on Windows; POSIX hosts retain Bash.
- id: bash-sandbox
  disabled: !!js process.platform === 'win32'

- id: pwsh-sandbox
  disabled: !!js process.platform !== 'win32'

- id: tool-bash
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable

- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
      inject: [settings]

    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup, subagentModelSelection]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash
